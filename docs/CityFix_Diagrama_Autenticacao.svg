<?xml version="1.0" encoding="UTF-8"?>
<svg class="mer cd" viewBox="0 0 1240 1137" width="1240" height="1137" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de classes da autenticação do CityFix (secção 4)"><title>Diagrama de classes da autenticação do CityFix (secção 4)</title><style>
svg { --ink:#1E1B2E; --text:#3A3648; --muted:#7A7590; --purple:#512BD4; --orange:#E0782F; --bg:#FFFFFF; --panel:#F4F3F7; --line:#DCD3F7; --boxBg:#FFFFFF; --boxHead:#12355b; --boxHeadTx:#FFFFFF; --rel:#7A7590; }
@media (prefers-color-scheme: dark) {
  svg { --ink:#F1EEFA; --text:#D8D3E8; --muted:#A39DBB; --purple:#B7A8F0; --orange:#F0A060; --bg:#17151F; --panel:#221F2E; --line:#3A3553; --boxBg:#221F2E; --boxHead:#2b4f7a; --boxHeadTx:#FFFFFF; --rel:#A39DBB; }
}
.bg { fill: var(--bg); }
.mer .ent rect.corpo { fill: var(--boxBg); stroke: var(--boxHead); stroke-width: 1.5; }
.mer .ent rect.cab { fill: var(--boxHead); }
.mer .ent text.titulo { fill: var(--boxHeadTx); font: 700 13px system-ui, sans-serif; }
.mer .ent text.campo { fill: var(--text); font: 11.5px "Cascadia Code", Consolas, monospace; }

.cd .band { fill: var(--panel); stroke: var(--line); }
.cd .bandlbl { fill: var(--purple); font: 700 12px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
.cd .bandnote { fill: var(--muted); font: italic 11.5px system-ui, sans-serif; }
.cd .stereo { font-weight: 400; font-size: 11px; opacity: .85; }
.cd path.call, .cd path.data, .cd path.dep, .cd path.comp, .cd path.assoc { fill: none; stroke-width: 1.6; }
.cd path.call { stroke: var(--purple); }
.cd path.data { stroke: var(--orange); stroke-width: 2; }
.cd path.dep { stroke: var(--muted); stroke-dasharray: 5 4; }
.cd path.comp { stroke: var(--rel); stroke-width: 2; }
.cd path.assoc { stroke: var(--rel); stroke-dasharray: 2 3; }
.cd .mk-call { fill: var(--purple); } .cd .mk-data { fill: var(--orange); } .cd .mk-dep { fill: var(--muted); }
.cd .albl { fill: var(--ink); font: 600 11px system-ui, sans-serif; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.cd .leg { fill: var(--text); font: 12.5px system-ui, sans-serif; }
.cd .legb { font-weight: 700; fill: var(--ink); }
</style><defs>
<marker id="mCall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-call" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="mData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-data" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="mDep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-dep" d="M0,0 L10,5 L0,10 z"/></marker>
</defs><rect class="bg" x="0" y="0" width="1240" height="1137"/><rect class="band" x="8" y="30" width="1224" height="200" rx="8"/><text class="bandlbl" x="20" y="48">Interface (Compose) · ui/</text><text class="bandnote" x="1220" y="48" text-anchor="end">o que se vê depende da sessão</text><g class="ent"><rect class="corpo" x="20" y="64" width="330" height="144" rx="5"/><rect class="cab" x="20" y="64" width="330" height="24" rx="5"/><rect class="cab" x="20" y="82" width="330" height="6"/><text class="titulo" x="28" y="80">MainActivity</text><text class="campo" x="28" y="101">when (session) {</text><text class="campo" x="28" y="117">  Loading → LoadingScreen</text><text class="campo" x="28" y="133">  MfaSetup → MfaSetupScreen</text><text class="campo" x="28" y="149">  AwaitingMfa → MfaScreen</text><text class="campo" x="28" y="165">  PendingValidation → PendingScreen</text><text class="campo" x="28" y="181">  Guest, Active → MainNavigation</text><text class="campo" x="28" y="197">}</text></g><g class="ent"><rect class="corpo" x="370" y="64" width="185" height="96" rx="5"/><rect class="cab" x="370" y="64" width="185" height="24" rx="5"/><rect class="cab" x="370" y="82" width="185" height="6"/><text class="titulo" x="378" y="80">LoginScreen</text><text class="campo" x="378" y="101">email, password</text><text class="campo" x="378" y="117">onSignIn</text><text class="campo" x="378" y="133">onForgotPassword</text><text class="campo" x="378" y="149">onRegister</text></g><g class="ent"><rect class="corpo" x="585" y="64" width="215" height="96" rx="5"/><rect class="cab" x="585" y="64" width="215" height="24" rx="5"/><rect class="cab" x="585" y="82" width="215" height="6"/><text class="titulo" x="593" y="80">RegisterScreen</text><text class="campo" x="593" y="101">name, email, password</text><text class="campo" x="593" y="117">phone, nif</text><text class="campo" x="593" y="133">impactDetection</text><text class="campo" x="593" y="149">onRegister</text></g><g class="ent"><rect class="corpo" x="820" y="64" width="190" height="96" rx="5"/><rect class="cab" x="820" y="64" width="190" height="24" rx="5"/><rect class="cab" x="820" y="82" width="190" height="6"/><text class="titulo" x="828" y="80">SessionScreens.kt</text><text class="campo" x="828" y="101">LoadingScreen</text><text class="campo" x="828" y="117">MfaSetupScreen (QR)</text><text class="campo" x="828" y="133">MfaScreen (código)</text><text class="campo" x="828" y="149">PendingScreen</text></g><g class="ent"><rect class="corpo" x="1030" y="64" width="195" height="96" rx="5"/><rect class="cab" x="1030" y="64" width="195" height="24" rx="5"/><rect class="cab" x="1030" y="82" width="195" height="6"/><text class="titulo" x="1038" y="80">Outros ecrãs</text><text class="campo" x="1038" y="101">ProfileScreen</text><text class="campo" x="1038" y="117">ValidateUsersScreen</text><text class="campo" x="1038" y="133">CategoriesScreen</text><text class="campo" x="1038" y="149">UserAvatar · PhotoSource…</text></g><rect class="band" x="8" y="270" width="1224" height="175" rx="8"/><text class="bandlbl" x="20" y="288">Apresentação · viewmodel/</text><text class="bandnote" x="1220" y="288" text-anchor="end">um ViewModel por formulário + o global da sessão</text><g class="ent"><rect class="corpo" x="20" y="304" width="330" height="112" rx="5"/><rect class="cab" x="20" y="304" width="330" height="24" rx="5"/><rect class="cab" x="20" y="322" width="330" height="6"/><text class="titulo" x="28" y="320">SessionViewModel</text><text class="campo" x="28" y="341">+ session: StateFlow&lt;Session&gt;</text><text class="campo" x="28" y="357">+ newMfaSecret</text><text class="campo" x="28" y="373">+ confirmMfaSetup(code) · verifyMfa(code)</text><text class="campo" x="28" y="389">+ saveProfile(phone, impact) · signOut()</text><text class="campo" x="28" y="405">âmbito: MainActivity (global)</text></g><g class="ent"><rect class="corpo" x="370" y="304" width="185" height="80" rx="5"/><rect class="cab" x="370" y="304" width="185" height="24" rx="5"/><rect class="cab" x="370" y="322" width="185" height="6"/><text class="titulo" x="378" y="320">LoginViewModel</text><text class="campo" x="378" y="341">+ state: LoginUiState</text><text class="campo" x="378" y="357">+ signIn()</text><text class="campo" x="378" y="373">+ resetPassword()</text></g><g class="ent"><rect class="corpo" x="585" y="304" width="215" height="80" rx="5"/><rect class="cab" x="585" y="304" width="215" height="24" rx="5"/><rect class="cab" x="585" y="322" width="215" height="6"/><text class="titulo" x="593" y="320">RegisterViewModel</text><text class="campo" x="593" y="341">+ state: RegisterUiState</text><text class="campo" x="593" y="357">  role ← domínio do e-mail</text><text class="campo" x="593" y="373">+ register()</text></g><g class="ent"><rect class="corpo" x="820" y="304" width="190" height="80" rx="5"/><rect class="cab" x="820" y="304" width="190" height="24" rx="5"/><rect class="cab" x="820" y="322" width="190" height="6"/><text class="titulo" x="828" y="320">IncidentsViewModel</text><text class="campo" x="828" y="341">session + separador</text><text class="campo" x="828" y="357">→ IncidentQuery</text><text class="campo" x="828" y="373">(flatMapLatest)</text></g><g class="ent"><rect class="corpo" x="1030" y="304" width="195" height="96" rx="5"/><rect class="cab" x="1030" y="304" width="195" height="24" rx="5"/><rect class="cab" x="1030" y="322" width="195" height="6"/><text class="titulo" x="1038" y="320">OperatorViewModel</text><text class="campo" x="1038" y="341">+ pendingCitizens</text><text class="campo" x="1038" y="357">+ categories</text><text class="campo" x="1038" y="373">+ activateCitizen(uid)</text><text class="campo" x="1038" y="389">+ saveCategory()</text></g><path class="call" d="M260,208 V302" marker-end="url(#mCall)"/><text class="albl" x="254" y="255" text-anchor="end">código (2.º fator)</text><path class="data" d="M310,302 V210" marker-end="url(#mData)"/><text class="albl" x="316" y="255" text-anchor="start">session</text><path class="call" d="M420,160 V302" marker-end="url(#mCall)"/><path class="data" d="M490,302 V162" marker-end="url(#mData)"/><text class="albl" x="455" y="255" text-anchor="middle">eventos ↓ · estado ↑</text><path class="call" d="M640,160 V302" marker-end="url(#mCall)"/><path class="data" d="M720,302 V162" marker-end="url(#mData)"/><text class="albl" x="680" y="255" text-anchor="middle">eventos ↓ · estado ↑</text><path class="call" d="M1080,160 V302" marker-end="url(#mCall)"/><path class="data" d="M1160,302 V162" marker-end="url(#mData)"/><text class="albl" x="1120" y="255" text-anchor="middle">eventos ↓ · estado ↑</text><rect class="band" x="8" y="485" width="1224" height="190" rx="8"/><text class="bandlbl" x="20" y="503">Dados · data/</text><text class="bandnote" x="1220" y="503" text-anchor="end">Firebase Authentication + Firestore</text><g class="ent"><rect class="corpo" x="20" y="519" width="530" height="144" rx="5"/><rect class="cab" x="20" y="519" width="530" height="24" rx="5"/><rect class="cab" x="20" y="537" width="530" height="6"/><text class="titulo" x="28" y="535">AuthRepository</text><text class="campo" x="28" y="556">+ session: StateFlow&lt;Session&gt; = combine(AuthStateListener,</text><text class="campo" x="28" y="572">      mfaUid (SharedPreferences), mfa/{uid}, users/{uid})</text><text class="campo" x="28" y="588">+ register(user, password)   transação: nifs/ + users/</text><text class="campo" x="28" y="604">+ signIn(email, password)</text><text class="campo" x="28" y="620">+ confirmMfaSetup(secret, code) · verifyMfa(code): Totp</text><text class="campo" x="28" y="636">+ uploadProfilePhoto · updateProfile · signOut</text><text class="campo" x="28" y="652">+ observePendingCitizens() · activateCitizen(uid)</text></g><g class="ent"><rect class="corpo" x="580" y="519" width="280" height="96" rx="5"/><rect class="cab" x="580" y="519" width="280" height="24" rx="5"/><rect class="cab" x="580" y="537" width="280" height="6"/><text class="titulo" x="588" y="535">CategoriesRepository</text><text class="campo" x="588" y="556">+ observeCategories()</text><text class="campo" x="588" y="572">+ observeActiveCategories()</text><text class="campo" x="588" y="588">+ saveCategory() · setActive()</text><text class="campo" x="588" y="604">+ createDefaults()</text></g><g class="ent"><rect class="corpo" x="880" y="519" width="345" height="80" rx="5"/><rect class="cab" x="880" y="519" width="345" height="24" rx="5"/><rect class="cab" x="880" y="537" width="345" height="6"/><text class="titulo" x="888" y="535">IncidentsRepository</text><text class="campo" x="888" y="556">+ observeIncidents(query: IncidentQuery)</text><text class="campo" x="888" y="572">  PublicActive · ByUser(uid) · All</text><text class="campo" x="888" y="588">(o resto igual à secção 3)</text></g><path class="call" d="M260,416 V517" marker-end="url(#mCall)"/><text class="albl" x="254" y="470" text-anchor="end">signIn · register · …</text><path class="data" d="M310,517 V418" marker-end="url(#mData)"/><text class="albl" x="316" y="470" text-anchor="start">session</text><path class="call" d="M440,384 V517" marker-end="url(#mCall)"/><path class="call" d="M650,384 V465 H520 V517" marker-end="url(#mCall)"/><path class="call" d="M1100,400 V470 H760 V517" marker-end="url(#mCall)"/><text class="albl" x="790" y="466" text-anchor="start">categorias</text><path class="call" d="M1180,400 V478 H530 V517" marker-end="url(#mCall)"/><text class="albl" x="1174" y="440" text-anchor="end">activateCitizen()</text><path class="call" d="M950,384 V517" marker-end="url(#mCall)"/><text class="albl" x="944" y="420" text-anchor="end">observeIncidents(query)</text><rect class="band" x="8" y="715" width="1224" height="130" rx="8"/><text class="bandlbl" x="20" y="733">Firebase e telemóvel</text><text class="bandnote" x="1220" y="733" text-anchor="end">serviços externos</text><g class="ent"><rect class="corpo" x="20" y="749" width="350" height="64" rx="5"/><rect class="cab" x="20" y="749" width="350" height="24" rx="5"/><rect class="cab" x="20" y="767" width="350" height="6"/><text class="titulo" x="28" y="765">Firebase Authentication</text><text class="campo" x="28" y="786">e-mail + password (1.º fator)</text><text class="campo" x="28" y="802">sendPasswordResetEmail</text></g><g class="ent"><rect class="corpo" x="390" y="749" width="300" height="64" rx="5"/><rect class="cab" x="390" y="749" width="300" height="24" rx="5"/><rect class="cab" x="390" y="767" width="300" height="6"/><text class="titulo" x="398" y="765">App autenticadora <tspan class="stereo">(no telemóvel)</tspan></text><text class="campo" x="398" y="786">lê o QR code (otpauth://)</text><text class="campo" x="398" y="802">mostra o código de 6 dígitos</text></g><g class="ent"><rect class="corpo" x="710" y="749" width="515" height="80" rx="5"/><rect class="cab" x="710" y="749" width="515" height="24" rx="5"/><rect class="cab" x="710" y="767" width="515" height="6"/><text class="titulo" x="718" y="765">Cloud Firestore</text><text class="campo" x="718" y="786">users/{uid}   mfa/{uid}   nifs/{PERFIL_NIF}</text><text class="campo" x="718" y="802">categories/{id}   incidents/{id}</text><text class="campo" x="718" y="818">regras por perfil (passo 4.j)</text></g><path class="call" d="M260,663 V747" marker-end="url(#mCall)"/><text class="albl" x="254" y="705" text-anchor="end">signIn · register</text><path class="call" d="M500,663 V700 H760 V747" marker-end="url(#mCall)"/><text class="albl" x="610" y="696" text-anchor="start">users/ · mfa/ · nifs/</text><path class="call" d="M780,615 V747" marker-end="url(#mCall)"/><text class="albl" x="786" y="725" text-anchor="start">categories/</text><path class="call" d="M1000,599 V747" marker-end="url(#mCall)"/><text class="albl" x="1006" y="705" text-anchor="start">incidents/</text><rect class="band" x="8" y="885" width="1224" height="130" rx="8"/><text class="bandlbl" x="20" y="903">Modelo · model/ (e utils/)</text><text class="bandnote" x="1220" y="903" text-anchor="end">Kotlin puro, sem Android</text><g class="ent"><rect class="corpo" x="20" y="919" width="400" height="80" rx="5"/><rect class="cab" x="20" y="919" width="400" height="24" rx="5"/><rect class="cab" x="20" y="937" width="400" height="6"/><text class="titulo" x="28" y="935">Session <tspan class="stereo">«sealed interface»</tspan></text><text class="campo" x="28" y="956">Loading · Guest</text><text class="campo" x="28" y="972">MfaSetup(email) · AwaitingMfa(email)</text><text class="campo" x="28" y="988">PendingValidation(user) · Active(user)</text></g><g class="ent"><rect class="corpo" x="440" y="919" width="380" height="80" rx="5"/><rect class="cab" x="440" y="919" width="380" height="24" rx="5"/><rect class="cab" x="440" y="937" width="380" height="6"/><text class="titulo" x="448" y="935">User <tspan class="stereo">«data class»</tspan></text><text class="campo" x="448" y="956">uid, name, email, phone, nif</text><text class="campo" x="448" y="972">role: UserRole · status: UserStatus</text><text class="campo" x="448" y="988">impactDetection, latitude?, longitude?</text></g><g class="ent"><rect class="corpo" x="840" y="919" width="385" height="80" rx="5"/><rect class="cab" x="840" y="919" width="385" height="24" rx="5"/><rect class="cab" x="840" y="937" width="385" height="6"/><text class="titulo" x="848" y="935">Enums e utils</text><text class="campo" x="848" y="956">UserRole: CITIZEN · OPERATOR</text><text class="campo" x="848" y="972">UserStatus: PENDING · ACTIVE</text><text class="campo" x="848" y="988">utils/Totp.kt (RFC 6238) · QrCode.kt</text></g><path class="call" d="M20,1045 H60" marker-end="url(#mCall)"/><text class="leg" x="68" y="1049">chamada / evento (desce)</text><path class="data" d="M260,1045 H300" marker-end="url(#mData)"/><text class="leg" x="308" y="1049">dados que sobem (Flow / StateFlow)</text><text class="leg" x="20" y="1075"><tspan class="legb">Registo:</tspan> RegisterScreen → RegisterViewModel.register() → Authentication + transação nifs/ e users/ → session = MfaSetup → QR code → confirmMfaSetup() → grava mfa/{uid}</text><text class="leg" x="20" y="1097"><tspan class="legb">Entrar:</tspan> LoginScreen → signIn() (password) → session = AwaitingMfa → código da app autenticadora → verifyMfa() → Totp.verify → Active ou PendingValidation</text><text class="leg" x="20" y="1119"><tspan class="legb">Validar:</tspan> OperatorViewModel.activateCitizen() → users/{uid}.status = ACTIVE → snapshot → a sessão do munícipe passa a Active sozinha</text></svg>
